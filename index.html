<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>뺙쓰타임</title>

<style>
body {
  margin: 0;
  background: #f3ead7;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial, sans-serif;
}

.container {
  position: relative;
  width: 380px;
}

.container img {
  width: 100%;
  display: block;
}

.led-cover {
  position: absolute;
  bottom: 20%;
  left: 50%;
  transform: translateX(-50%);
  width: 55%;
  height: 18%;
  background: #1c1c1c;
  border-radius: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.time-text {
  color: #ffffff;
  font-size: 20px;
  letter-spacing: 2px;
  text-shadow: 0 0 8px #ffffff;
}
</style>
</head>

<body>

<div class="container">
  <img src="https://i.imgur.com/8Km9tLL.png">
  <div class="led-cover">
    <div class="time-text">
      뺙쓰타임 <span id="time"></span>
    </div>
  </div>
</div>

<script>
function updateTime() {
  const now = new Date();
  const koreaTime = new Intl.DateTimeFormat("ko-KR", {
    timeZone: "Asia/Seoul",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hour12: false
  }).format(now);

  document.getElementById("time").textContent = koreaTime;
}

setInterval(updateTime, 1000);
updateTime();
</script>

</body>
</html>
